name: Maven CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven

    - name: Create config.properties for tests
      run: |
        mkdir -p src/test/resources
        echo "api_base_url=${{ secrets.API_BASE_URL }}" > src/test/resources/config.properties
        echo "test_user_email=${{ secrets.TEST_USER_EMAIL }}" >> src/test/resources/config.properties
        echo "test_user_password=${{ secrets.TEST_USER_PASSWORD }}" >> src/test/resources/config.properties
        echo "test_admin_email=${{ secrets.TEST_ADMIN_EMAIL }}" >> src/test/resources/config.properties
        echo "test_admin_password=${{ secrets.TEST_ADMIN_PASSWORD }}" >> src/test/resources/config.properties
        echo "config.properties gerado com sucesso"

    - name: Build and run tests with Maven
      run: mvn -B package --file pom.xml